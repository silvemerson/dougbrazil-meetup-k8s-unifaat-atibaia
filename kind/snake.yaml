apiVersion: apps/v1
kind: Deployment
metadata:
  name: snake-classic
  labels:
    app: snake-classic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snake-classic
  template:
    metadata:
      labels:
        app: snake-classic
    spec:
      containers:
      - name: snake-classic
        image: silvemerson/snake-classic:0.1
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: snake-classic
  labels:
    app: snake-classic
spec:
  selector:
    app: snake-classic
  type: NodePort
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    nodePort: 30080
