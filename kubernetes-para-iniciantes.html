<h2 id="o-que-%C3%A9-um-container">O que é um container?</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>                                ┌─────────────────────────────────────┐
                                │            Container                │
                                │  ┌─────────────────────────────┐    │
                                │  │  sua aplicação              │    │
                                │  │  + dependências             │    │
                                │  │  + bibliotecas              │    │
                                │  │  + variáveis de ambiente    │    │
                                │  └─────────────────────────────┘    │
                                │         compartilha o kernel        │
                                └──────────────┬──────────────────────┘
                                               │
                                      Sistema Operacional Host
</code></pre>
<blockquote>
<p>Um container empacota a aplicação <strong>e tudo que ela precisa para rodar</strong> — e roda de forma isolada no mesmo kernel do host</p>
</blockquote>

<h2 id="o-problema-de-escala">O problema de escala</h2>
<p>Imagina sua aplicação rodando em <strong>10 containers</strong>. Tudo certo.</p>
<p>Agora imagina <strong>200 containers</strong>, em <strong>8 servidores diferentes</strong>:</p>
<ul>
<li data-marpit-fragment="1">Em qual servidor sobe cada container?</li>
<li data-marpit-fragment="2">Como garantir que o container reinicia se cair?</li>
<li data-marpit-fragment="3">Como distribuir carga entre as réplicas?</li>
<li data-marpit-fragment="4">Como fazer update sem derrubar o serviço?</li>
<li data-marpit-fragment="5">Como os containers se comunicam entre servidores?</li>
</ul>
<blockquote>
<p>Fazer isso na mão é inviável. Você precisa de um <strong>orquestrador</strong>.</p>
</blockquote>

<h2 id="como-surgiu-o-kubernetes">Como surgiu o Kubernetes</h2>
<ul>
<li data-marpit-fragment="1"><strong>2003</strong> — Google cria o <strong>Borg</strong>, sistema interno de orquestração</li>
<li data-marpit-fragment="2">Borg gerenciava <em>bilhões</em> de containers por semana nos data centers do Google</li>
<li data-marpit-fragment="3"><strong>2013</strong> — Google inicia projeto baseado nas lições do Borg</li>
<li data-marpit-fragment="4"><strong>Junho de 2014</strong> — Kubernetes anunciado publicamente</li>
<li data-marpit-fragment="5"><strong>2016</strong> — Doado para a <strong>CNCF</strong> (Cloud Native Computing Foundation)</li>
<li data-marpit-fragment="6"><strong>Hoje</strong> — padrão da indústria, com contribuições de centenas de empresas</li>
</ul>
<blockquote>
<p>O nome vem do grego: <strong>κυβερνήτης</strong> — timoneiro, piloto de navio</p>
</blockquote>

<h2 id="o-que-%C3%A9-kubernetes">O que é Kubernetes</h2>
<blockquote>
<p><strong>Kubernetes</strong> é um sistema open source de orquestração de containers que automatiza o deploy, escalabilidade e gerenciamento de aplicações containerizadas.</p>
</blockquote>
<p>Em termos simples:</p>
<ul>
<li data-marpit-fragment="1">Você diz <strong>o que quer</strong> — &quot;quero 3 réplicas da minha app rodando&quot;</li>
<li data-marpit-fragment="2">Kubernetes cuida do <strong>como</strong> — em qual nó, como manter, como recuperar</li>
</ul>
<p><strong>Kubernetes não substitui o Docker</strong> — ele usa o Docker (ou outro runtime) por baixo dos panos</p>
<footer><img src="4linux-logo/logo-4linux.png" alt="" style="height:40px;" />     <img src="logos-dougbr/fundo-transparente.png" alt="" style="height:40px;" /></footer>

<h2 id="control-plane-o-c%C3%A9rebro-do-cluster">Control Plane: o cérebro do cluster</h2>
<ul>
<li data-marpit-fragment="1"><strong>API Server</strong> — porta de entrada para tudo; toda interação passa por aqui (<code>kubectl</code> fala com ele)</li>
<li data-marpit-fragment="2"><strong>etcd</strong> — banco de dados distribuído; armazena o estado completo do cluster</li>
<li data-marpit-fragment="3"><strong>Scheduler</strong> — decide em qual nó cada Pod vai rodar</li>
<li data-marpit-fragment="4"><strong>Controller Manager</strong> — garante que o estado real bate com o desejado</li>
</ul>
<blockquote>
<p>Se você pede &quot;quero 3 réplicas&quot;, o Controller Manager é quem percebe que caiu uma e sobe outra</p>
</blockquote>
<footer><img src="4linux-logo/logo-4linux.png" alt="" style="height:40px;" />     <img src="logos-dougbr/fundo-transparente.png" alt="" style="height:40px;" /></footer>

<h2 id="worker-node-onde-as-aplica%C3%A7%C3%B5es-rodam">Worker Node: onde as aplicações rodam</h2>
<ul>
<li data-marpit-fragment="1"><strong>kubelet</strong> — agente em cada nó; recebe ordens do control plane e garante que os containers estão rodando</li>
<li data-marpit-fragment="2"><strong>kube-proxy</strong> — cuida das regras de rede e roteamento de tráfego entre pods</li>
<li data-marpit-fragment="3"><strong>Container Runtime</strong> — quem realmente executa os containers (containerd, CRI-O)</li>
</ul>
<blockquote>
<p>O control plane <strong>gerencia</strong>, os worker nodes <strong>executam</strong></p>
</blockquote>

<h2 id="quando-usar-kubernetes">Quando usar Kubernetes</h2>

<table>
<thead>
<tr>
<th><strong>Use Kubernetes quando...</strong></th>
<th><strong>Talvez não precise quando...</strong></th>
</tr>

<tbody>
<tr>
<td>Muitos microsserviços para gerenciar</td>
<td>É um projeto pequeno ou MVP</td>
</tr>
<tr>
<td>Precisa de alta disponibilidade</td>
<td>Time pequeno, pouca experiência</td>
</tr>
<tr>
<td>Escala horizontal frequente</td>
<td>Monólito simples e estável</td>
</tr>
<tr>
<td>Times diferentes deployando em paralelo</td>
<td>Custo operacional é restrição crítica</td>
</tr>
<tr>
<td>Multi-cloud ou portabilidade é requisito</td>
<td>Uma VM simples resolve o problema</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Kubernetes resolve problemas de escala. Se você não tem esse problema, talvez seja overkill.</p>
</blockquote>

<h2 id="vantagens-do-kubernetes">Vantagens do Kubernetes</h2>
<ul>
<li data-marpit-fragment="1"><strong>Self-healing</strong> — se um container cai, o K8s reinicia automaticamente</li>
<li data-marpit-fragment="2"><strong>Auto-scaling</strong> — escala pods horizontalmente conforme a demanda</li>
<li data-marpit-fragment="3"><strong>Rolling updates</strong> — atualiza a aplicação sem downtime</li>
<li data-marpit-fragment="4"><strong>Rollback</strong> — voltou pra versão anterior em um comando</li>
<li data-marpit-fragment="5"><strong>Portabilidade</strong> — roda igual na AWS, GCP, Azure ou on-premise</li>
<li data-marpit-fragment="6"><strong>Service discovery</strong> — pods se encontram pelo nome, sem IP fixo</li>
<li data-marpit-fragment="7"><strong>Gerenciamento de configuração</strong> — ConfigMaps e Secrets nativos</li>
</ul>

<h2 id="service-tipos-de-exposi%C3%A7%C3%A3o">Service: tipos de exposição</h2>
<ul>
<li data-marpit-fragment="1"><strong>ClusterIP</strong> — acesso só de dentro do cluster. Padrão. Ideal para comunicação entre serviços internos.</li>
<li data-marpit-fragment="2"><strong>NodePort</strong> — expõe uma porta fixa (30000–32767) em cada nó do cluster. Útil para testes e desenvolvimento.</li>
<li data-marpit-fragment="3"><strong>LoadBalancer</strong> — provisiona automaticamente um load balancer externo na nuvem (AWS ELB, GCP LB...). Usado em produção.</li>
</ul>
<blockquote>
<p>Para ambientes locais (minikube), use <strong>NodePort</strong> ou <code>kubectl port-forward</code></p>
</blockquote>

<h2 id="o-que-aconteceu-por-baixo-dos-panos">O que aconteceu por baixo dos panos</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1. kubectl apply  →  API Server recebe o YAML
2. API Server     →  salva o estado desejado no etcd
3. Scheduler      →  escolhe um Worker Node disponível
4. kubelet        →  recebe a tarefa e instrui o containerd
5. containerd     →  faz pull da imagem pengbai/docker-supermario
6. Container      →  sobe e escuta na porta 8080
7. kube-proxy     →  configura o roteamento do NodePort
8. Service        →  balanceia o tráfego até o Pod
</code></pre>
<blockquote>
<p>Tudo isso em segundos, de forma declarativa</p>
</blockquote>

  max-width: calc(100% - 1.2em);

@import 'gaia';

:root {
  --color-background: #0B1426;
  --color-foreground: #FFFFFF;
  --color-highlight: #00E6CC;
  --color-accent: #00C4A7;
  --color-secondary: #4ECDC4;
  --color-dimmed: #8B9DC3;
  --4linux-green: #00E6CC;
  --4linux-dark-green: #00C4A7;
  --4linux-blue: #4ECDC4;
  --4linux-dark: #0B1426;
}

section {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  background-color: var(--4linux-dark);
  background: linear-gradient(135deg, #0B1426 0%, #1a2332 100%);
  color: var(--color-foreground);
  font-size: 28px;
  line-height: 1.4;
  padding: 50px 60px 90px 60px;
  max-width: 1280px;
  margin: 0 auto;
  box-sizing: border-box;
  position: relative;
}

section::before {
  content: &quot;&quot;;
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--4linux-green) 0%, #f15a29 100%) !important;
  z-index: 10;
}

section p {
  margin-bottom: 0.8em;
  max-width: 100%;
  word-wrap: break-word;
  hyphens: auto;
}

section ul {
  margin-left: 1.2em;
  max-width: calc(100% - 1.2em);
}

section li {
  margin-bottom: 0.5em;
  line-height: 1.3;
  word-wrap: break-word;
  hyphens: auto;
}

section h1 {
  font-size: 2.4em;
  font-weight: 700;
  color: var(--4linux-green);
  text-shadow: 0 0 20px rgba(0, 230, 204, 0.3);
  margin-bottom: 0.8em;
  line-height: 1.1;
  border-bottom: none;
  white-space: normal;
}

section h2 {
  font-size: 2.2em;
  font-weight: 600;
  color: var(--color-foreground);
  margin-bottom: 0.8em;
  position: relative;
}

section h2::before {
  content: &quot;&quot;;
  position: absolute;
  left: -25px;
  top: 50%;
  transform: translateY(-50%);
  width: 4px;
  height: 50px;
  background: linear-gradient(135deg, var(--4linux-green), var(--4linux-blue));
  border-radius: 2px;
}

section h3 {
  font-size: 1.6em;
  font-weight: 500;
  color: var(--4linux-blue);
  margin-bottom: 0.6em;
}

section strong {
  color: var(--4linux-green);
  font-weight: 700;
}

section code {
  background: rgba(0, 230, 204, 0.1);
  color: var(--4linux-green);
  padding: 0.2em 0.5em;
  border-radius: 4px;
  font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
  border: 1px solid rgba(0, 230, 204, 0.2);
}

section pre {
  background: #060e1a;
  border: 1px solid rgba(0, 230, 204, 0.25);
  border-radius: 8px;
  padding: 1em 1.2em;
  margin: 0.6em 0;
}

section pre code {
  background: transparent;
  border: none;
  padding: 0;
  color: #e2e8f0;
  font-size: 0.82em;
  line-height: 1.6;
}

section ul li::marker {
  color: var(--4linux-green);
}

section::after {
  font-weight: 500;
  content: attr(data-marpit-pagination) ' / ' attr(data-marpit-pagination-total);
  font-size: 14px;
  color: var(--4linux-green);
  background: none;
  border: none;
  box-shadow: none;
  backdrop-filter: none;
  padding: 0;
  border-radius: 0;
  position: fixed;
  top: 25px;
  right: 30px;
}
